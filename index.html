    <style>
      * {
        margin: 0;
        padding: 0;
        box-sizing: border-box;
      }
      html {
        background-color: #020202;
      }
      body {
        background-color: #020202;
        color: #cccccc;
        font-family: 'Space Grotesk', system-ui, sans-serif;
        -webkit-font-smoothing: antialiased;
        -moz-osx-font-smoothing: grayscale;
        overflow-x: hidden;
      }
      #root {
        min-height: 100vh;
      }
      .initial-boot {
        min-height: 100svh;
        display: flex;
        align-items: center;
        justify-content: center;
      }
      .initial-boot > div {
        width: min(660px, 80vw);
      }
      .initial-boot small {
        font:
          10px 'Share Tech Mono',
          monospace;
        letter-spacing: 0.15em;
        color: #777;
      }
      .initial-boot strong {
        display: block;
        margin: 25px 0;
        font:
          700 clamp(40px, 10vw, 100px)/1 'Share Tech Mono',
          monospace;
        letter-spacing: -0.055em;
      }
      .initial-boot strong span {
        display: block;
        color: #ff5555;
      }
      .initial-boot a {
        color: inherit;
        font:
          14px 'Share Tech Mono',
          monospace;
        padding: 12px 0;
      }
      .initial-recovery {
        visibility: hidden;
        animation: show-recovery 0s 8s forwards;
      }
      @keyframes show-recovery {
        to {
          visibility: visible;
        }
      }
    </style>
  </head>
